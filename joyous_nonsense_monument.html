

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Grand Monument to Joyous Nonsense</title>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Amatic SC', cursive;
            background: linear-gradient(to bottom, #f0f0f0, #d0d0d0);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        main {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
            }
        }
        section {
            padding: 20px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }
        .flower {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 10px;
        }
        .petals {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            animation: spin 10s linear infinite;
        }
        .petal {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: red;
            border-radius: 50%;
            top: 50%;
            left: 50%;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .machine {
            position: relative;
            width: 300px;
            height: 200px;
        }
        .gear {
            position: absolute;
            background-color: gray;
            border-radius: 50%;
            animation: spin 5s linear infinite;
        }
        .lever {
            position: absolute;
            width: 20px;
            height: 100px;
            background-color: brown;
        }
        .screen {
            position: absolute;
            width: 100px;
            height: 50px;
            background-color: black;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            text-align: center;
        }
        .art {
            cursor: pointer;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        footer {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>The Grand Monument to Joyous Nonsense</h1>
    </header>
    <main>
        <section id="garden">
            <h2>The Garden of Absurd Delights</h2>
            <div id="flowers"></div>
            <button id="sing-button">Make the flowers sing</button>
        </section>
        <section id="machine">
            <h2>The Machine of Whimsical Wonders</h2>
            <div class="machine">
                <div class="gear" style="width: 50px; height: 50px; top: 20px; left: 20px;"></div>
                <div class="gear" style="width: 30px; height: 30px; top: 40px; left: 60px; animation-duration: 3s;"></div>
                <div class="lever" style="top: 100px; left: 100px;"></div>
                <div class="screen" style="top: 20px; left: 150px;">Click Activate</div>
            </div>
            <label for="hue-slider">Adjust Hue:</label>
            <input type="range" id="hue-slider" min="0" max="360" step="1">
            <label for="speed-slider">Adjust Speed:</label>
            <input type="range" id="speed-slider" min="1" max="10" step="0.1" value="5">
            <button id="activate-button">Activate Machine</button>
        </section>
        <section id="gallery">
            <h2>The Gallery of Surreal Art</h2>
            <svg width="200" height="200" class="art">
                <rect x="10" y="10" width="180" height="180" fill="none" stroke="black" stroke-width="2" />
                <circle cx="100" cy="100" r="50" fill="blue" />
                <line x1="50" y1="50" x2="150" y2="150" stroke="red" stroke-width="2" />
            </svg>
            <p id="quote">Click the art to reveal a secret message.</p>
        </section>
    </main>
    <footer>
        <p>© 2023 The Society for Joyous Nonsense. All rights reserved. Enjoy the absurdity!</p>
    </footer>
    <script>
        // Function to play tone
        function playTone(frequency, duration) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            oscillator.connect(audioCtx.destination);
            oscillator.start();
            setTimeout(() => oscillator.stop(), duration);
        }

        // Generate flowers
        const flowersDiv = document.querySelector('#flowers');
        for (let i = 0; i < 3; i++) {
            const flower = document.createElement('div');
            flower.className = 'flower';
            const petals = document.createElement('div');
            petals.className = 'petals';
            for (let j = 0; j < 6; j++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.transform = `rotate(${j * 60}deg) translate(40px)`;
                petal.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                petals.appendChild(petal);
            }
            flower.appendChild(petals);
            flowersDiv.appendChild(flower);
        }

        // Sing button
        document.querySelector('#sing-button').addEventListener('click', () => {
            playTone(440, 500);
            playTone(550, 500);
            playTone(660, 500);
        });

        // Machine sliders and button
        document.querySelector('#hue-slider').addEventListener('input', (e) => {
            document.querySelector('.machine').style.filter = `hue-rotate(${e.target.value}deg)`;
        });

        document.querySelector('#speed-slider').addEventListener('input', (e) => {
            const speed = e.target.value;
            document.querySelectorAll('.gear').forEach(gear => {
                gear.style.animationDuration = `${speed}s`;
            });
        });

        document.querySelector('#activate-button').addEventListener('click', () => {
            const poems = [
                "Roses are red,\nViolets are blue,\nThis machine is whimsical,\nAnd so are you!",
                "In a world of logic,\nWhere sense is king,\nThis machine defies,\nAnd makes nonsense sing.",
                "Tick tock, goes the clock,\nBut time stands still,\nWhen nonsense rules,\nWith a joyous thrill."
            ];
            const randomPoem = poems[Math.floor(Math.random() * poems.length)];
            document.querySelector('.screen').textContent = randomPoem;
        });

        // Art click event
        document.querySelector('.art').addEventListener('click', () => {
            const messages = [
                "The universe is a donut.",
                "Time is an illusion, lunchtime doubly so.",
                "The answer is 42, but what's the question?"
            ];
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            document.querySelector('#quote').textContent = randomMessage;
        });
    </script>
</body>
</html>
